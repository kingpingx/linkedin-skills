<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Week Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>LinkedIn Week Planner</h1>
      <p id="weekLabel" class="muted"></p>
    </div>
    <div class="top-actions">
      <button id="exportBtn" class="btn">Export JSON</button>
      <button id="resetAllBtn" class="btn ghost">Reset all</button>
    </div>
  </header>

  <main class="wrap">
    <nav id="week" class="week" aria-label="Days of the week"></nav>
    <section id="detail" class="detail card" aria-live="polite"></section>
    <aside class="side">
      <div id="progress" class="card"></div>
      <div id="checklist" class="card"></div>
      <div id="previous" class="card"></div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
